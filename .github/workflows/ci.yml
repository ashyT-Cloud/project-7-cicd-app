name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: project-7-cicd-app

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::487054650859:role/Project7-GitHubActions-ECR-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ashyT-Cloud
          repositories: |
            project-7-gitops

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ashyT-Cloud/project-7-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          ref: main
          persist-credentials: false

      - name: Update Dev image and application version
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          APP_VERSION=$(cat VERSION)

          export IMAGE_TAG
          export APP_VERSION

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          image_path = Path(
              "gitops/apps/demo-app/overlays/dev/kustomization.yaml"
          )

          version_path = Path(
              "gitops/apps/demo-app/overlays/dev/kustomization.yaml"
          )

          # Update immutable image tag in the Dev overlay
          image_content = image_path.read_text()

          image_content, image_count = re.subn(
              r'(^\s*newTag:\s*).*$',
              rf'\g<1>{os.environ["IMAGE_TAG"]}',
              image_content,
              count=1,
              flags=re.MULTILINE,
          )

          if image_count != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one newTag entry, found {image_count}"
              )

          image_path.write_text(image_content)

          # Update application version in the base Deployment
          version_content = version_path.read_text()

          version_content, version_count = re.subn(
              r'(^\s*-\s*op:\s*add\s*\n'
              r'\s*path:\s*/spec/template/spec/containers/0/env/-\s*\n'
              r'\s*value:\s*\n'
              r'\s*name:\s*APP_VERSION\s*\n'
              r'\s*value:\s*).*$',
              rf'\g<1>"{os.environ["APP_VERSION"]}"',
              version_content,
              count=1,
              flags=re.MULTILINE,
          )

          if version_count != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one APP_VERSION entry, found {version_count}"
              )

          version_path.write_text(version_content)
          PY

      - name: Verify GitOps change
        run: |
          echo "=== Dev image tag ==="
          grep -n "newTag" \
            gitops/apps/demo-app/overlays/dev/kustomization.yaml

          echo "=== Dev application version ==="
          grep -n -A5 "APP_VERSION" \
            gitops/apps/demo-app/overlays/dev/kustomization.yaml

      - name: Commit and push GitOps change
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITOPS_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "project-7-gitops-updater[bot]"
          git config user.email "project-7-gitops-updater[bot]@users.noreply.github.com"

          git add \
            apps/demo-app/overlays/dev/kustomization.yaml

          git diff --cached --quiet && {
            echo "No GitOps changes detected."
            exit 0
          }

          git commit \
            -m "chore: deploy demo-app ${IMAGE_TAG}"

          git push \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/ashyT-Cloud/project-7-gitops.git" \
            HEAD:main
